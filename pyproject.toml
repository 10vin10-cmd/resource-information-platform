[project]
name = "resource-information-platform"
version = "1.0.0"
description = "Cited answers about Texas county weather from NOAA records, with a county map and similarity search"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "numpy>=2.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "ruff>=0.6"]

[project.scripts]
resource = "resource_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resource_platform*"]

[tool.setuptools.package-data]
resource_platform = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
