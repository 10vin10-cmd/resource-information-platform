id: water_use
title: Water use by county and category
publisher: Texas Water Development Board, Water Use Survey
source_url: https://www.twdb.texas.gov/waterplanning/waterusesurvey/estimates
notes: >
  Annual estimates, revised as surveys come in. An answer always cites the
  capture it was read from, so a later revision never silently changes it.
keys:
  county: County
  year: Year
metrics:
  population:      {column: Population,      unit: people,     label: Population}
  municipal:       {column: Municipal,       unit: acre-feet,  label: Municipal use}
  manufacturing:   {column: Manufacturing,   unit: acre-feet,  label: Manufacturing use}
  mining:          {column: Mining,          unit: acre-feet,  label: Mining use}
  steam_electric:  {column: Steam Electric,  unit: acre-feet,  label: Power generation use}
  irrigation:      {column: Irrigation,      unit: acre-feet,  label: Irrigation use}
  livestock:       {column: Livestock,       unit: acre-feet,  label: Livestock use}
  groundwater_share: {column: Groundwater Share, unit: percent, label: Share from groundwater}
# Reported separately by the publisher; the platform never adds categories up
# into a total that the source did not state.
