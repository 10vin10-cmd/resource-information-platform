name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Map app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  python:
    name: Platform
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Demo
        run: |
          resource sample
          resource build
          resource ask "How much water did Bexar County use in 2022?"
          resource ask "Why did irrigation fall in Hale County?"
          resource similar Hale 2022 --evaluate
          resource log
          {
            echo '## Similarity evaluation (synthetic sample)'
            echo '```json'
            resource similar Hale 2022 --evaluate -k 0 | sed -n '/^{/,/^}/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Serve smoke test
        run: |
          resource serve --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/api/meta > /dev/null && break; sleep 1; done
          curl -sf localhost:8000/ | grep -q "Resource Information Platform"
          curl -sf -X POST localhost:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "irrigation in Hale County 2020"}' | grep -q '"answered"'
